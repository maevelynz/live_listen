name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Typecheck (shared)
        run: npm -w @livelisten/shared run type-check

      - name: Build (shared)
        run: npm -w @livelisten/shared run build

      - name: Typecheck (api)
        run: npm -w @livelisten/api run type-check

      - name: Lint (api)
        run: npm -w @livelisten/api run lint

      - name: Build (api)
        run: npm -w @livelisten/api run build

      - name: Typecheck (web)
        run: npm -w @livelisten/web run type-check

      - name: Lint (web)
        run: npm -w @livelisten/web run lint

      - name: Build (web)
        run: npm -w @livelisten/web run build

