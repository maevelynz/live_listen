version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: livelisten-postgres
    environment:
      POSTGRES_USER: livelisten
      POSTGRES_PASSWORD: livelisten
      POSTGRES_DB: livelisten
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livelisten"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
